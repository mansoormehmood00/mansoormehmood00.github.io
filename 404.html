<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Mansoor Mehmood</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script>try{var t=localStorage.getItem('mm-theme-v2');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}catch(e){}</script>
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }

    .nf p { margin: 18px auto 34px; max-width: 40ch; color: var(--muted); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="label">Page not found</p>
      <h1>404</h1>
      <p>This page doesn’t exist — but the conversation can still start on the home page.</p>
      <a class="btn btn-primary" href="/">Back to the portfolio</a>
    </div>
  </main>
</body>
</html>
